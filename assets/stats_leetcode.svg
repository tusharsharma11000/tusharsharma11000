<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 215" width="495" height="215">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="donutEasy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#73daca"/>
    </linearGradient>
    <linearGradient id="donutMed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#e0af68"/>
    </linearGradient>
    <linearGradient id="donutHard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#db4b4b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="495" height="215" fill="url(#bg)" rx="6" stroke="#414868" stroke-width="1"/>

  <!-- Title bar accent -->
  <rect x="0" y="0" width="495" height="3" fill="#FFA116" rx="2"/>

  <!-- Title -->
  <text x="25" y="32" font-family="'Segoe UI', Arial, sans-serif"
        font-size="16" font-weight="700" fill="#FFA116">LeetCode Stats</text>

  <!-- LeetCode label -->
  <rect x="380" y="16" width="90" height="22" fill="#2a1800" rx="6" stroke="#FFA116" stroke-width="0.8"/>
  <text x="425" y="31" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#FFA116" font-weight="600">tusharsharma11000</text>

  <!-- Divider -->
  <line x1="25" y1="46" x2="470" y2="46" stroke="#414868" stroke-width="0.8"/>

  <!-- Vertical divider -->
  <line x1="220" y1="55" x2="220" y2="200" stroke="#414868" stroke-width="0.8"/>

  <!-- ══ LEFT: Donut Chart ══ -->

  <!-- Donut background ring -->
  <circle cx="110" cy="130" r="58" fill="none" stroke="#2a2d40" stroke-width="12"/>

  <!-- Hard ring (outermost) — 13 problems = ~9% of total, ~32° -->
  <circle cx="110" cy="130" r="58" fill="none"
          stroke="url(#donutHard)" stroke-width="12"
          stroke-dasharray="0 364" stroke-dashoffset="-91"
          stroke-linecap="butt">
    <animate attributeName="stroke-dasharray"
      values="0 364; 32 332; 32 332"
      dur="1.5s" begin="0.8s" fill="freeze"/>
  </circle>

  <!-- Medium ring — 52 problems = ~36%, ~132° -->
  <circle cx="110" cy="130" r="58" fill="none"
          stroke="url(#donutMed)" stroke-width="12"
          stroke-dasharray="0 364" stroke-dashoffset="-59"
          stroke-linecap="butt">
    <animate attributeName="stroke-dasharray"
      values="0 364; 130 234; 130 234"
      dur="1.5s" begin="0.5s" fill="freeze"/>
  </circle>

  <!-- Easy ring — 78 problems = ~55%, ~200° -->
  <circle cx="110" cy="130" r="58" fill="none"
          stroke="url(#donutEasy)" stroke-width="12"
          stroke-dasharray="0 364" stroke-dashoffset="-91"
          stroke-linecap="butt">
    <animate attributeName="stroke-dasharray"
      values="0 364; 196 168; 196 168"
      dur="1.5s" begin="0.2s" fill="freeze"/>
  </circle>

  <!-- Center: total solved -->
  <text x="110" y="122" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="30" font-weight="700" fill="#c0caf5" filter="url(#glow)"
        opacity="0">
    143
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>
  <text x="110" y="143" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#a9b1d6">Solved</text>

  <!-- ══ RIGHT: Breakdown table ══ -->

  <!-- Easy -->
  <rect x="240" y="68" width="10" height="10" fill="#9ece6a" rx="2"/>
  <text x="258" y="79" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#a9b1d6">Easy</text>
  <text x="460" y="79" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#9ece6a" font-weight="600">78</text>
  <!-- Easy progress bar -->
  <rect x="240" y="84" width="220" height="5" fill="#2a2d40" rx="2.5"/>
  <rect x="240" y="84" width="0" height="5" fill="#9ece6a" rx="2.5">
    <animate attributeName="width" values="0;159" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>

  <!-- Medium -->
  <rect x="240" y="108" width="10" height="10" fill="#ff9e64" rx="2"/>
  <text x="258" y="119" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#a9b1d6">Medium</text>
  <text x="460" y="119" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#ff9e64" font-weight="600">52</text>
  <!-- Medium progress bar -->
  <rect x="240" y="124" width="220" height="5" fill="#2a2d40" rx="2.5"/>
  <rect x="240" y="124" width="0" height="5" fill="#ff9e64" rx="2.5">
    <animate attributeName="width" values="0;104" dur="1.2s" begin="0.4s" fill="freeze"/>
  </rect>

  <!-- Hard -->
  <rect x="240" y="148" width="10" height="10" fill="#f7768e" rx="2"/>
  <text x="258" y="159" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#a9b1d6">Hard</text>
  <text x="460" y="159" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#f7768e" font-weight="600">13</text>
  <!-- Hard progress bar -->
  <rect x="240" y="164" width="220" height="5" fill="#2a2d40" rx="2.5"/>
  <rect x="240" y="164" width="0" height="5" fill="#f7768e" rx="2.5">
    <animate attributeName="width" values="0;28" dur="1.2s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- Divider -->
  <line x1="240" y1="185" x2="470" y2="185" stroke="#414868" stroke-width="0.8"/>

  <!-- Acceptance Rate -->
  <text x="240" y="200" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#a9b1d6">Acceptance Rate</text>
  <text x="460" y="200" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#FFA116" font-weight="600">63.2%</text>
</svg>
