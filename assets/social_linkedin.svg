<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 68" width="190" height="68">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <radialGradient id="corner" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="190" height="68" fill="url(#bg)" rx="10"/>
  <!-- Corner glow -->
  <rect width="190" height="68" fill="url(#corner)" rx="10"/>

  <!-- Animated border -->
  <rect x="1" y="1" width="188" height="66" fill="none" stroke="#0A66C2" stroke-width="1.5" rx="9">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="68" fill="#0A66C2" rx="3">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- LinkedIn icon box -->
  <rect x="16" y="16" width="36" height="36" fill="#0A66C2" rx="7" filter="url(#glow)"/>
  <text x="34" y="39" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="18" font-weight="900" fill="white">in</text>

  <!-- Platform name -->
  <text x="62" y="31" font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="700" fill="white">LinkedIn</text>

  <!-- Sub label -->
  <text x="62" y="49" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#8b949e">View Profile  →</text>

  <!-- Dot pulse bottom right -->
  <circle cx="174" cy="52" r="3.5" fill="#0A66C2" opacity="0.6">
    <animate attributeName="r" values="3;5.5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

