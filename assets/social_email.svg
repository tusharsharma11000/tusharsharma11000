<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 68" width="190" height="68">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#200a08"/>
    </linearGradient>
    <radialGradient id="corner" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="envGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#c5221f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="190" height="68" fill="url(#bg)" rx="10"/>
  <rect width="190" height="68" fill="url(#corner)" rx="10"/>

  <!-- Animated border -->
  <rect x="1" y="1" width="188" height="66" fill="none" stroke="#EA4335" stroke-width="1.5" rx="9">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="68" fill="url(#envGrad)" rx="3">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Gmail envelope icon box -->
  <rect x="16" y="16" width="36" height="36" fill="#200a08" rx="7" filter="url(#glow)"/>
  <!-- Envelope body -->
  <rect x="19" y="22" width="30" height="22" fill="none" stroke="#EA4335" stroke-width="1.5" rx="2"/>
  <!-- Envelope M flap -->
  <polyline points="19,22 34,34 49,22" fill="none" stroke="#EA4335" stroke-width="1.5"/>
  <!-- Gmail multicolor dot (simplified) -->
  <circle cx="34" cy="44" r="2" fill="#EA4335"/>

  <!-- Platform name -->
  <text x="62" y="31" font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="700" fill="white">Gmail</text>

  <!-- Sub label -->
  <text x="62" y="47" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9.5" fill="#8b949e">Send Email  →</text>

  <!-- Dot pulse -->
  <circle cx="174" cy="52" r="3.5" fill="#EA4335" opacity="0.6">
    <animate attributeName="r" values="3;5.5;3" dur="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.9s" repeatCount="indefinite"/>
  </circle>
</svg>

