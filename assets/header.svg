<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#071e3d"/>
      <stop offset="100%" stop-color="#0c2461"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)"/>

  <!-- Twinkling stars -->
  <circle cx="45"  cy="35" r="1.5" fill="#bae6fd"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="18" r="1"   fill="#7dd3fc"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="55" r="1"   fill="#38bdf8"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.0s" repeatCount="indefinite"/></circle>
  <circle cx="280" cy="28" r="1.5" fill="#38bdf8"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="45" r="1"   fill="#bae6fd"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.0s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="15" r="1.5" fill="#7dd3fc"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="550" cy="60" r="1"   fill="#7dd3fc"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="30" r="1.5" fill="#bae6fd"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="15" r="1"   fill="#38bdf8"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="55" r="1"   fill="#7dd3fc"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="35" r="1.5" fill="#bae6fd"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="22" r="1"   fill="#7dd3fc"><animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="60" r="1.5" fill="#38bdf8"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.3s" repeatCount="indefinite"/></circle>

  <!-- Main Title -->
  <text x="450" y="96" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="700" fill="url(#titleGrad)" opacity="0">
    Hi there! I'm Tushar
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="143" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#93c5fd" letter-spacing="0.5" opacity="0">
    Backend Developer  |  Python &amp; Data Enthusiast
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.0s" fill="freeze"/>
  </text>

  <!-- Accent divider line -->
  <line x1="305" y1="160" x2="595" y2="160" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
  </line>

  <!-- Wave back layer -->
  <path fill="url(#waveGrad)" opacity="0.45">
    <animate attributeName="d"
      values="M0,185 C225,162 450,198 675,175 C787,163 843,183 900,178 L900,220 L0,220 Z;
              M0,176 C200,198 420,166 640,185 C760,194 840,174 900,181 L900,220 L0,220 Z;
              M0,185 C225,162 450,198 675,175 C787,163 843,183 900,178 L900,220 L0,220 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Wave front layer -->
  <path fill="#0ea5e9" opacity="0.22">
    <animate attributeName="d"
      values="M0,198 C150,188 300,208 450,198 C600,188 750,206 900,199 L900,220 L0,220 Z;
              M0,193 C170,208 340,188 510,200 C660,210 780,190 900,196 L900,220 L0,220 Z;
              M0,198 C150,188 300,208 450,198 C600,188 750,206 900,199 L900,220 L0,220 Z"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Wave shimmer edge -->
  <path fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.3">
    <animate attributeName="d"
      values="M0,185 C225,162 450,198 675,175 C787,163 843,183 900,178;
              M0,176 C200,198 420,166 640,185 C760,194 840,174 900,181;
              M0,185 C225,162 450,198 675,175 C787,163 843,183 900,178"
      dur="6s" repeatCount="indefinite"/>
  </path>
</svg>

