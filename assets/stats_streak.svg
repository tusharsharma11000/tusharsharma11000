<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 170" width="495" height="170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="495" height="170" fill="url(#bg)" rx="6" stroke="#414868" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="165" y1="20" x2="165" y2="155" stroke="#414868" stroke-width="0.8"/>
  <line x1="330" y1="20" x2="330" y2="155" stroke="#414868" stroke-width="0.8"/>

  <!-- ══ LEFT: Total Contributions ══ -->
  <text x="82" y="38" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#a9b1d6" letter-spacing="0.5">Total Contributions</text>

  <text x="82" y="88" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="36" font-weight="700" fill="#c0caf5" filter="url(#glow)"
        opacity="0">
    287
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <text x="82" y="112" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#414868">Nov 4, 2025 - Now</text>

  <!-- Top bar accent (blue) -->
  <rect x="0" y="0" width="165" height="3" fill="#70a5fd" rx="2" opacity="0.8"/>

  <!-- ══ CENTER: Current Streak ══ -->
  <text x="247" y="38" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#a9b1d6" letter-spacing="0.5">Current Streak</text>

  <!-- Animated flame -->
  <g transform="translate(227, 48)">
    <!-- Flame outer (orange) -->
    <path d="M20,36 C20,36 8,28 8,18 C8,10 14,4 20,0 C20,0 16,8 18,14 C22,8 28,4 30,0 C32,12 36,16 36,24 C36,32 28,38 20,36 Z"
          fill="url(#fireGrad)" filter="url(#glow)">
      <animate attributeName="d"
        values="M20,36 C20,36 8,28 8,18 C8,10 14,4 20,0 C20,0 16,8 18,14 C22,8 28,4 30,0 C32,12 36,16 36,24 C36,32 28,38 20,36 Z;
                M20,36 C20,36 6,26 6,16 C6,8 13,2 20,0 C20,0 17,9 19,15 C23,7 30,3 32,0 C34,13 38,18 38,26 C38,34 28,38 20,36 Z;
                M20,36 C20,36 8,28 8,18 C8,10 14,4 20,0 C20,0 16,8 18,14 C22,8 28,4 30,0 C32,12 36,16 36,24 C36,32 28,38 20,36 Z"
        dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Flame inner (yellow core) -->
    <path d="M20,30 C20,30 13,24 13,17 C13,12 17,8 20,5 C20,5 18,11 20,16 C22,11 25,8 26,5 C28,12 31,16 31,21 C31,27 25,31 20,30 Z"
          fill="#ff9e64" opacity="0.8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="247" y="108" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ff9e64" filter="url(#glow)"
        opacity="0">
    7 days
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </text>

  <text x="247" y="126" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#414868">Oct 28 - Nov 3, 2026</text>

  <!-- Top bar accent (orange flame) -->
  <rect x="165" y="0" width="165" height="3" fill="url(#fireGrad)" rx="0" opacity="0.9"/>

  <!-- ══ RIGHT: Longest Streak ══ -->
  <text x="413" y="38" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#a9b1d6" letter-spacing="0.5">Longest Streak</text>

  <text x="413" y="88" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="36" font-weight="700" fill="#c0caf5" filter="url(#glow)"
        opacity="0">
    18
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>

  <text x="413" y="108" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="13" fill="#a9b1d6">days</text>

  <text x="413" y="126" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#414868">Aug 1 - Aug 18, 2026</text>

  <!-- Top bar accent (teal) -->
  <rect x="330" y="0" width="165" height="3" fill="#38bdae" rx="2" opacity="0.8"/>

  <!-- Bottom total label -->
  <text x="247" y="155" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#414868" letter-spacing="1">CONTRIBUTION  STREAK  STATS</text>
</svg>
