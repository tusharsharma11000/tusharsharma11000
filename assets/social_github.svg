<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 68" width="190" height="68">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="corner" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="190" height="68" fill="url(#bg)" rx="10"/>
  <rect width="190" height="68" fill="url(#corner)" rx="10"/>

  <!-- Animated border -->
  <rect x="1" y="1" width="188" height="66" fill="none" stroke="#8b949e" stroke-width="1.5" rx="9">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="68" fill="#8b949e" rx="3">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- GitHub icon box -->
  <rect x="16" y="16" width="36" height="36" fill="#21262d" rx="7" filter="url(#glow)"/>
  <!-- Simplified octocat: circle head + cat ears -->
  <circle cx="34" cy="34" r="9" fill="none" stroke="white" stroke-width="1.8"/>
  <circle cx="34" cy="34" r="4" fill="white"/>
  <!-- Ear hints -->
  <line x1="28" y1="27" x2="25" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="27" x2="43" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tentacle hint -->
  <path d="M28,40 Q25,46 29,47" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M40,40 Q43,46 39,47" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Platform name -->
  <text x="62" y="31" font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="700" fill="white">GitHub</text>

  <!-- Sub label -->
  <text x="62" y="49" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#8b949e">tusharsharma11000</text>

  <!-- Dot pulse -->
  <circle cx="174" cy="52" r="3.5" fill="#8b949e" opacity="0.6">
    <animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>

