<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 195" width="355" height="195">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0c2461"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="355" height="195" fill="url(#bg)" rx="14"/>

  <!-- Animated border glow -->
  <rect x="1" y="1" width="353" height="193" fill="none"
        stroke="url(#border)" stroke-width="1.5" rx="13">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="355" height="4" fill="url(#topBar)" rx="2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner glow blob -->
  <circle cx="325" cy="165" r="40" fill="#38bdf8" opacity="0.04">
    <animate attributeName="r" values="35;48;35" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.04;0.09;0.04" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Code icon -->
  <text x="28" y="62" font-family="'Fira Code', Consolas, monospace"
        font-size="30" fill="#38bdf8" filter="url(#glow)"
        opacity="0">
    &lt;/&gt;
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- PORTFOLIO label pill -->
  <rect x="115" y="33" width="88" height="20" fill="#1a3a5f" rx="10" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="159" y="47" text-anchor="middle"
        font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#38bdf8"
        font-weight="700" letter-spacing="1" opacity="0">
    PORTFOLIO
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Project title -->
  <text x="28" y="95" font-family="'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="700" fill="white" opacity="0">
    My Portfolio
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- Description -->
  <text x="28" y="118" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11.5" fill="#8b949e" opacity="0">
    Personal portfolio showcasing projects,
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
  </text>
  <text x="28" y="134" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11.5" fill="#8b949e" opacity="0">
    skills &amp; experience.
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Divider -->
  <line x1="28" y1="147" x2="327" y2="147" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
  </line>

  <!-- Tech badges -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
    <rect x="28" y="157" width="44" height="22" fill="#0f2a4a" rx="6"/>
    <rect x="28" y="157" width="44" height="22" fill="none" stroke="#38bdf8" stroke-width="0.8" rx="6" opacity="0.5"/>
    <text x="50" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif"
          font-size="10" fill="#7dd3fc" font-weight="600">HTML</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <rect x="78" y="157" width="38" height="22" fill="#0f2a4a" rx="6"/>
    <rect x="78" y="157" width="38" height="22" fill="none" stroke="#38bdf8" stroke-width="0.8" rx="6" opacity="0.5"/>
    <text x="97" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif"
          font-size="10" fill="#7dd3fc" font-weight="600">CSS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <rect x="122" y="157" width="40" height="22" fill="#0f2a4a" rx="6"/>
    <rect x="122" y="157" width="40" height="22" fill="none" stroke="#38bdf8" stroke-width="0.8" rx="6" opacity="0.5"/>
    <text x="142" y="172" text-anchor="middle" font-family="'Segoe UI', sans-serif"
          font-size="10" fill="#7dd3fc" font-weight="600">JS</text>
  </g>

  <!-- Arrow -->
  <text x="325" y="182" text-anchor="end" font-family="'Segoe UI', sans-serif"
        font-size="16" fill="#38bdf8" opacity="0">
    View →
    <animate attributeName="opacity" values="0;0.7" dur="0.5s" begin="1s" fill="freeze"/>
  </text>
</svg>

